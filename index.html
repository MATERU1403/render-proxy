<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy</title>
  <style>
    :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --accent:#3b6cf6; --muted:#6b7280; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --fg:#e6e8eb; --card:#181b21; --accent:#6b8cff; --muted:#9aa1ab; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:16px; }
    main { width:100%; max-width:560px; background:var(--card); border-radius:14px; padding:28px;
           box-shadow:0 4px 24px rgba(0,0,0,.08); }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    p { margin:0 0 20px; color:var(--muted); }
    form { display:flex; gap:8px; }
    input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid #8884;
            background:transparent; color:inherit; font-size:1rem; }
    button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff;
             font-size:1rem; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Proxy</h1>
    <p>Enter a website address to browse it through this server.</p>
    <form action="/go" method="get">
      <input name="url" placeholder="example.com" autofocus required>
      <button type="submit">Go</button>
    </form>
  </main>
</body>
</html>
